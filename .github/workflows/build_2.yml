name: Binaries

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release from this run
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
      tag:
        description: Release tag (empty = v<app version>-pre.<run number>)
        type: string
        default: ''
  push:
    tags: [ 'v*' ]
  schedule:
    - cron: '0 0 * * 0' # Her pazar gece yarısı otomatik çalışır ve yeni sürüm oluşturur

permissions:
  contents: write

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: subhra74/xdm
          ref: master

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Write Maven toolchains.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml <<XML
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides><version>25</version></provides>
              <configuration><jdkHome>${JAVA_HOME}</jdkHome></configuration>
            </toolchain>
          </toolchains>
          XML

      - name: Build jar
        run: mvn -B -q -pl xdm-app -am package

      - uses: actions/upload-artifact@v7
        with:
          name: xdm-app-jar
          path: xdm-app/target/xdm-app.jar
          if-no-files-found: error

  macos:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: subhra74/xdm
          ref: master

      - uses: actions/download-artifact@v8
        with:
          name: xdm-app-jar
          path: xdm-app/target

      - name: Pinned Liberica JDK
        run: |
          home="$(packaging/fetch-jdk.sh "mac-${{ matrix.arch }}" | tail -1)"
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"

      - name: Build dmg
        run: packaging/build-bundle.sh -s --type dmg

      - uses: actions/upload-artifact@v7
        with:
          path: build/dist/*.dmg
          archive: false
          if-no-files-found: error

  windows:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: subhra74/xdm
          ref: master

      - uses: actions/download-artifact@v8
        with:
          name: xdm-app-jar
          path: xdm-app/target

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pinned Liberica JDK and WiX
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\setup-windows.ps1 `
            -Arch ${{ matrix.arch }} -InstallJdk -InstallWix -AcceptWixEula
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build MSI
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build-bundle.ps1 `
            -Arch ${{ matrix.arch }} -Type msi -SkipBuild
          if ($LASTEXITCODE -ne 0) { exit$LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          path: build/dist/windows-${{ matrix.arch }}/*.msi
          archive: false
          if-no-files-found: error

  linux:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: subhra74/xdm
          ref: master

      - uses: actions/download-artifact@v8
        with:
          name: xdm-app-jar
          path: xdm-app/target

      - name: Build packages
        run: packaging/build-linux.sh -s --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          path: build/linux-${{ matrix.arch }}/*.deb
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/linux-${{ matrix.arch }}/*.rpm
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/linux-${{ matrix.arch }}/*.pkg.tar.zst
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/linux-${{ matrix.arch }}/*.tar.gz
          archive: false
          if-no-files-found: error

  release:
    needs: [ macos, windows, linux ]
    if: >-
      always() && needs.windows.result == 'success' && needs.linux.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: subhra74/xdm
          ref: master

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="$(sed -n 's/.*"currentVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
            xdm-app/src/main/resources/app-version.json | head -1)"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" == *-* ]] && pre=true || pre=false
          else
            tag="${INPUT_TAG:-v$version-pre.$GITHUB_RUN_NUMBER}"
            pre="${INPUT_PRERELEASE:-false}"
          fi
          shopt -s nullglob
          files=(dist/*.dmg dist/*.msi dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.tar.gz)
          ls -l "${files[@]}"
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag"
          {
            echo "## Downloads"
            echo
            echo "| Installer | Notes |"
            echo "|---|---|"
            for f in "${files[@]}"; do
              name="${f##*/}"
              case "$name" in *arm64*|*aarch64*) cpu=ARM; mac="Apple Silicon (M1 or later)" ;; *) cpu=x64; mac=Intel ;; esac
              case "$name" in
                *.msi)        note="For Windows $cpu (Windows 10/11)" ;;
                *.dmg)        note="For $mac mac" ;;
                *.deb)        note="For Debian / Ubuntu / Linux Mint $cpu" ;;
                *.rpm)        note="For Fedora / RHEL / openSUSE $cpu" ;;
                *.pkg.tar.zst) note="For Arch Linux / Manjaro $cpu" ;;
                *.tar.gz)     note="For any Linux $cpu (portable, no install)" ;;
                *)            note="" ;;
              esac
              echo "| [$name]($base/$name) | $note |"
            done
            echo
            echo "[Code signing policy](https://github.com/subhra74/xdm/blob/master/CODE_SIGNING_POLICY.md)"
          } > downloads.md
          cat downloads.md
          flags=(--title "XDM ${tag#v}" --generate-notes --target "$GITHUB_SHA
